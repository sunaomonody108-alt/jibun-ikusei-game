name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the live site serves this commit
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in $(seq 1 20); do
            if curl -fsS -H 'Cache-Control: no-cache' "${url}story.js" -o /dev/null \
              && curl -fsS -H 'Cache-Control: no-cache' "${url}index.html" | grep -q "$(grep -o 'id="version">[^<]*' index.html)"; then
              echo "Live site is up to date: ${url}"
              exit 0
            fi
            sleep 15
          done
          echo "Live site did not update in time" >&2
          exit 1
