<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a44">
  <title>自分育成ゲーム</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="card hero">
      <div class="avatar" id="avatar">🧑</div>
      <div class="hero-text">
        <div class="name" id="name">あなたの分身</div>
        <div class="level">Lv.<span id="level">1</span></div>
        <div class="bar"><div class="fill" id="xpbar"></div></div>
        <div class="small" id="xptext"></div>
      </div>
    </section>

    <section class="card">
      <h2>今日</h2>
      <div class="today" id="today"></div>
      <div class="week" id="week"></div>
    </section>

    <section class="card">
      <h2>記録する</h2>
      <form id="logform">
        <div class="chips" id="activities"></div>
        <div class="row" id="amountrow">
          <input id="amount" type="number" inputmode="numeric" min="1" placeholder="量">
          <span id="unit"></span>
          <select id="multiplier" hidden></select>
        </div>
        <div class="row">
          <button type="submit" class="primary">記録する</button>
          <button type="button" id="mini">2分だけやった（+5）</button>
        </div>
        <div class="toast" id="toast" aria-live="polite"></div>
      </form>
    </section>

    <section class="card">
      <h2>今週のボス</h2>
      <div class="boss">
        <div class="boss-icon" id="bossicon">👾</div>
        <div class="boss-body">
          <div class="bar boss-bar"><div class="fill" id="bossbar"></div></div>
          <div class="small" id="bosstext"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>能力</h2>
      <div id="stats"></div>
    </section>

    <section class="card">
      <h2>今日の記録</h2>
      <ul class="logs" id="logs"></ul>
    </section>

    <section class="card">
      <h2>週のまとめ</h2>
      <pre class="summary" id="summary"></pre>
      <button type="button" id="share">まとめを送る・コピー</button>
    </section>

    <footer class="small">
      データはこの端末の中だけに保存されます。
      <button type="button" id="rename" class="link">名前を変える</button>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
