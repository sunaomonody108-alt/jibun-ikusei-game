<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20283a">
  <title>自分育成ゲーム</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="console">
    <!-- 戦闘画面 -->
    <section class="field" id="field">
      <div class="plate enemy-plate">
        <div class="plate-top">
          <span id="bossname">ダラダラスライム</span>
          <span class="lv">Lv<span id="bosslv">1</span></span>
        </div>
        <div class="hp-row">
          <span class="hp-label">HP</span>
          <div class="hp-track"><div class="hp-fill" id="bosshp"></div></div>
        </div>
      </div>
      <div class="ground enemy-ground"></div>
      <div class="sprite enemy" id="bossicon">👾</div>

      <div class="ground player-ground"></div>
      <div class="sprite player" id="avatar">🧑</div>
      <div class="plate player-plate">
        <div class="plate-top">
          <span id="name">あなたの分身</span>
          <span class="lv">Lv<span id="level">1</span></span>
        </div>
        <div class="week" id="week"></div>
        <div class="hp-row">
          <span class="hp-label">EXP</span>
          <div class="hp-track exp"><div class="hp-fill exp-fill" id="xpbar"></div></div>
        </div>
        <div class="plate-num" id="xptext"></div>
      </div>
    </section>

    <!-- メッセージ欄 -->
    <section class="msgbox" id="msgbox">
      <p id="msg"></p>
      <span class="next" id="next">▼</span>
    </section>

    <!-- コマンド -->
    <section class="menu" id="menu"></section>

    <!-- サブ画面（ステータス・週報） -->
    <section class="sheet" id="sheet" hidden>
      <div class="sheet-box">
        <div class="sheet-body" id="sheetbody"></div>
        <button type="button" class="cmd wide" id="sheetclose">もどる</button>
      </div>
    </section>

    <footer class="foot">データはこの端末の中だけに保存されます。 <span id="version">v4</span></footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
